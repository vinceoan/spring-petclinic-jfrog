# Set COMPOSE_IMAGE_PREFIX (ending in /) to pull the images through a registry mirror.
services:
  mysql:
    image: ${COMPOSE_IMAGE_PREFIX:-}mysql:9.7
    labels:
      org.springframework.boot.service-connection: mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
      - MYSQL_USER=petclinic
      - MYSQL_PASSWORD=petclinic
      - MYSQL_DATABASE=petclinic
    volumes:
      - "./conf.d:/etc/mysql/conf.d:ro"
  postgres:
    image: ${COMPOSE_IMAGE_PREFIX:-}postgres:18.4
    labels:
      org.springframework.boot.service-connection: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=petclinic
      - POSTGRES_USER=petclinic
      - POSTGRES_DB=petclinic
